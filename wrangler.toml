name = "wisp-server-workers"
main = "build/worker/shim.mjs"
compatibility_date = "2023-12-01"

[build]
command = "cargo install -q worker-build@^0.1 && cargo install -q wasm-bindgen-cli --version 0.2.100 --force && WASM_BINDGEN_BIN=\"$HOME/.cargo/bin/wasm-bindgen\" worker-build --release"

[env.dev]
build = { command = "cargo install -q worker-build@^0.1 && cargo install -q wasm-bindgen-cli --version 0.2.100 --force && WASM_BINDGEN_BIN=\"$HOME/.cargo/bin/wasm-bindgen\" worker-build --dev" }
